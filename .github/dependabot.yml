# Weekly, grouped dependency updates (free on GitHub). Versions stay exact; the licence check in
# `pnpm check` still decides whether a new version may come in.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/deploy/mdns"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node.js line in .nvmrc (22); raise it together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # collab's @hocuspocus/extension-redis pins ioredis 5; move with Hocuspocus.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/collab", "/deploy/caddy", "/deploy/mdns"]
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/deploy"]
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
