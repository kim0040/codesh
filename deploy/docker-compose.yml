# codesh production stack (docs/ARCHITECTURE.md §1).
#
#   cp .env.example .env && ./generate-secrets.sh     # once
#   docker compose up -d --build                      # from this directory, or -f deploy/docker-compose.yml
#   docker compose up -d --scale collab=3             # more collab instances (or COLLAB_REPLICAS in .env)
#
# Only Caddy publishes ports. MongoDB, Valkey, api and collab are reachable on the internal network.
name: codesh

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-app-env: &app-env
  NODE_ENV: production
  MONGO_URL: mongodb://codesh:${MONGO_PASSWORD:?run ./generate-secrets.sh}@mongo:27017/codesh?authSource=admin
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?run ./generate-secrets.sh}@valkey:6379
  COLLAB_SECRET: ${COLLAB_SECRET:?run ./generate-secrets.sh}

services:
  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    image: codesh/caddy:${CODESH_VERSION:-dev}
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: codesh/api:${CODESH_VERSION:-dev}
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      SESSION_SECRET: ${SESSION_SECRET:?run ./generate-secrets.sh}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-${NETWORK_SUBNET:-172.29.88.0/24}}
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-1200}
      RATE_LIMIT_CODE_PER_MIN: ${RATE_LIMIT_CODE_PER_MIN:-30}
      RATE_LIMIT_CREATE_PER_MIN: ${RATE_LIMIT_CREATE_PER_MIN:-60}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
    expose: ["3001"]
    stop_grace_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Scale-ready: no container name, no published port. Each replica gets its own COLLAB_INSTANCE_ID
  # (the container host name) and Caddy finds all replicas through the service name.
  collab:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    image: codesh/collab:${CODESH_VERSION:-dev}
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
    expose: ["3002"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # SIGTERM flushes every open document before the process exits (§6.6).
    stop_grace_period: 40s
    deploy:
      replicas: ${COLLAB_REPLICAS:-1}
    depends_on:
      mongo:
        condition: service_healthy
      valkey:
        condition: service_healthy

  mongo:
    <<: *hardening
    cap_drop: []
    image: mongo:8.0.34
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-2}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: codesh
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?run ./generate-secrets.sh}
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - mongo-data:/data/db
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u codesh -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  valkey:
    <<: *hardening
    cap_drop: []
    image: valkey/valkey:8.1.10
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?run ./generate-secrets.sh}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - noeviction
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional: advertises codesh.local on the LAN (COMPOSE_PROFILES=mdns). Linux hosts only (host network).
  mdns:
    profiles: [mdns]
    restart: unless-stopped
    build:
      context: ./mdns
    image: codesh/mdns:${CODESH_VERSION:-dev}
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-codesh.local}
      MDNS_PORT: ${HTTP_PORT:-80}
      MDNS_IP: ${MDNS_IP:-}

networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.29.88.0/24}

volumes:
  mongo-data:
  valkey-data:
  caddy-data:
  caddy-config:
