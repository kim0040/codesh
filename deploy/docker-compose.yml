# gachipad production stack (docs/ARCHITECTURE.md §1).
#
#   cp .env.example .env && ./generate-secrets.sh     # once
#   docker compose pull && docker compose up -d       # released images of GACHIPAD_VERSION from GACHIPAD_REGISTRY
#   docker compose build && docker compose up -d      # or build them from this source tree instead
#   docker compose up -d --scale collab=3             # more collab instances (or COLLAB_REPLICAS in .env)
#
# Offline bundles carry the same images (docker load) and this file without the build sections.
# Only Caddy publishes ports. The selected database, Valkey, api and collab are internal.
name: ${GACHIPAD_PROJECT:-gachipad}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-app-env: &app-env
  NODE_ENV: production
  # A pre-selection .env has no derived URL: retain its MongoDB connection even before the
  # operator runs generate-secrets.sh. Fresh templates explicitly select the SQLite file.
  DATABASE_URL: ${DATABASE_URL:-${GACHIPAD_DATABASE_URL:-mongodb://${MONGO_APP_USER:-gachipad_app}:${MONGO_APP_PASSWORD:?run ./generate-secrets.sh}@mongo:27017/${MONGO_DATABASE:-gachipad}?authSource=${MONGO_DATABASE:-gachipad}}}
  # Used as the MongoDB fallback for older app configurations and MongoDB deployments.
  MONGO_URL: mongodb://${MONGO_APP_USER:-gachipad_app}:${MONGO_APP_PASSWORD:?run ./generate-secrets.sh}@mongo:27017/${MONGO_DATABASE:-gachipad}?authSource=${MONGO_DATABASE:-gachipad}
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?run ./generate-secrets.sh}@valkey:6379
  COLLAB_SECRET: ${COLLAB_SECRET:?run ./generate-secrets.sh}

services:
  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    image: ${GACHIPAD_REGISTRY:-ghcr.io/kim0040}/gachipad-web:${GACHIPAD_VERSION:?set GACHIPAD_VERSION in .env; on a 1.0.x install run ./generate-secrets.sh .env first, it migrates the old settings}
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_ALIASES: ${SITE_ALIASES:-}
      METRICS_SUBNET: ${NETWORK_SUBNET:-172.29.88.0/24}
      TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
      GACHIPAD_NETWORK: ${GACHIPAD_NETWORK:-internal}
      GACHIPAD_PUBLIC_TLS: ${GACHIPAD_BEHIND_PROXY:+proxy}
      ACME_EMAIL_CONFIG: ${ACME_EMAIL:+email }${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${GACHIPAD_REGISTRY:-ghcr.io/kim0040}/gachipad-api:${GACHIPAD_VERSION:?set GACHIPAD_VERSION in .env; on a 1.0.x install run ./generate-secrets.sh .env first, it migrates the old settings}
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      SESSION_SECRET: ${SESSION_SECRET:?run ./generate-secrets.sh}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GACHIPAD_NETWORK: ${GACHIPAD_NETWORK:-internal}
      TRUST_PROXY: ${TRUST_PROXY:-${NETWORK_SUBNET:-172.29.88.0/24}}
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-1200}
      RATE_LIMIT_CODE_PER_MIN: ${RATE_LIMIT_CODE_PER_MIN:-30}
      RATE_LIMIT_CODE_GLOBAL_FAILURES_PER_MIN: ${RATE_LIMIT_CODE_GLOBAL_FAILURES_PER_MIN:-60}
      RATE_LIMIT_CREATE_PER_MIN: ${RATE_LIMIT_CREATE_PER_MIN:-60}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
      QUOTA_WINDOW_SECONDS: ${QUOTA_WINDOW_SECONDS:-86400}
      QUOTA_SHARES_PER_CLIENT: ${QUOTA_SHARES_PER_CLIENT:-200}
      QUOTA_SHARES_PER_IP: ${QUOTA_SHARES_PER_IP:-1000}
      QUOTA_UPLOADS_PER_CLIENT: ${QUOTA_UPLOADS_PER_CLIENT:-200}
      QUOTA_UPLOADS_PER_IP: ${QUOTA_UPLOADS_PER_IP:-1000}
      QUOTA_BYTES_PER_CLIENT: ${QUOTA_BYTES_PER_CLIENT:-536870912}
      QUOTA_BYTES_PER_IP: ${QUOTA_BYTES_PER_IP:-2147483648}
      UPLOAD_STORAGE_MAX_BYTES: ${UPLOAD_STORAGE_MAX_BYTES:-10737418240}
      SSE_MAX_PER_CLIENT: ${SSE_MAX_PER_CLIENT:-20}
      SSE_MAX_PER_IP: ${SSE_MAX_PER_IP:-200}
      PRESENCE_MAX_PER_NET: ${PRESENCE_MAX_PER_NET:-500}
      PENDING_MAX_PER_SHARE: ${PENDING_MAX_PER_SHARE:-100}
      BROADCASTS_PER_MIN: ${BROADCASTS_PER_MIN:-5}
      BROADCAST_FANOUT_MAX: ${BROADCAST_FANOUT_MAX:-500}
      # The update check, the only outbound request (docs/OPERATIONS.md "업데이트"): on|off.
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
      UPDATE_REPO: ${UPDATE_REPO:-kim0040/gachipad}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATE_STATUS_FILE: /gachipad-state/update.json
      # Node's fetch uses HTTPS_PROXY only with NODE_USE_ENV_PROXY=1, set here when a proxy is.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_USE_ENV_PROXY: ${HTTPS_PROXY:+1}
    volumes:
      # Status of deploy/update.sh (last run, auto-update), shown in the admin console.
      - ./state:/gachipad-state:ro
      - gachipad-data:/data
    expose: ["3001"]
    stop_grace_period: 20s
    depends_on:
      mongo-users:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy

  # Scale-ready: no container name, no published port. Each replica gets its own COLLAB_INSTANCE_ID
  # (the container host name) and Caddy finds all replicas through the service name.
  collab:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/collab/Dockerfile
    image: ${GACHIPAD_REGISTRY:-ghcr.io/kim0040}/gachipad-collab:${GACHIPAD_VERSION:?set GACHIPAD_VERSION in .env; on a 1.0.x install run ./generate-secrets.sh .env first, it migrates the old settings}
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *app-env
      # Tuning only (docs/OPERATIONS.md §11.6): milliseconds a busy document batches cursor changes; 0 turns it off.
      COLLAB_BROADCAST_WINDOW_MS: ${COLLAB_BROADCAST_WINDOW_MS:-30}
    expose: ["3002"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # SIGTERM flushes every open document before the process exits (§6.6).
    stop_grace_period: 40s
    volumes:
      - gachipad-data:/data
    deploy:
      replicas: ${COLLAB_REPLICAS:-1}
    depends_on:
      mongo-users:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy

  mongo:
    profiles: [mongodb]
    <<: *hardening
    cap_drop: []
    image: mongo:8.0.34
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-2}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-gachipad}
      MONGO_DATABASE: ${MONGO_DATABASE:-gachipad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?run ./generate-secrets.sh}
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - mongo-data:/data/db
    stop_grace_period: 30s
    # Through the network address: while a new volume is initialised, a temporary mongod listens on
    # loopback only, and a loopback ping would report healthy before others can connect.
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --host "$$(hostname)" --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot on every start: creates the application user, or resets its password and role, so new
  # and existing volumes (installed before this user existed) both run without the root user.
  mongo-users:
    profiles: [mongodb]
    <<: *hardening
    restart: "no"
    image: mongo:8.0.34
    environment:
      HOME: /tmp
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-gachipad}
      MONGO_DATABASE: ${MONGO_DATABASE:-gachipad}
      MONGO_APP_USER: ${MONGO_APP_USER:-gachipad_app}
      MONGO_ROOT_PASSWORD: ${MONGO_PASSWORD:?run ./generate-secrets.sh}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?run ./generate-secrets.sh}
    # Passwords come from the environment, never from command arguments.
    entrypoint:
      - mongosh
      - --quiet
      - --host
      - mongo
      - --eval
      - >-
        db.getSiblingDB("admin").auth(process.env.MONGO_ROOT_USER, process.env.MONGO_ROOT_PASSWORD);
        const app = db.getSiblingDB(process.env.MONGO_DATABASE);
        const spec = { pwd: process.env.MONGO_APP_PASSWORD, roles: [{ role: "readWrite", db: process.env.MONGO_DATABASE }] };
        if (app.getUser(process.env.MONGO_APP_USER)) app.updateUser(process.env.MONGO_APP_USER, spec);
        else app.createUser({ user: process.env.MONGO_APP_USER, ...spec });
        print("mongo-users: application user ready");
    depends_on:
      mongo:
        condition: service_healthy

  postgres:
    profiles: [postgres]
    <<: *hardening
    cap_drop: []
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-gachipad}
      POSTGRES_USER: ${POSTGRES_USER:-gachipad_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h localhost -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  valkey:
    <<: *hardening
    cap_drop: []
    image: valkey/valkey:8.1.10
    # The password reaches valkey-server through a private config file: the arguments of the
    # container's init process are visible to every user of the host in `ps`.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        conf="$$(mktemp)"
        printf 'requirepass "%s"\n' "$$(printf '%s' "$$VALKEY_PASSWORD" | sed 's/[\\"]/\\&/g')" >"$$conf"
        chown valkey:valkey "$$conf"
        exec docker-entrypoint.sh valkey-server "$$conf" --appendonly yes --maxmemory "$$VALKEY_MAXMEMORY" --maxmemory-policy noeviction
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run ./generate-secrets.sh}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-1gb}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional: advertises gachipad.local on the LAN (COMPOSE_PROFILES=mdns). Linux hosts only (host network).
  mdns:
    profiles: [mdns]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/mdns/Dockerfile
    image: ${GACHIPAD_REGISTRY:-ghcr.io/kim0040}/gachipad-mdns:${GACHIPAD_VERSION:?set GACHIPAD_VERSION in .env; on a 1.0.x install run ./generate-secrets.sh .env first, it migrates the old settings}
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      MDNS_HOSTNAME: ${MDNS_HOSTNAME:-gachipad.local}
      MDNS_ALIASES: ${MDNS_ALIASES:-}
      MDNS_PORT: ${HTTP_PORT:-80}
      MDNS_IP: ${MDNS_IP:-}

networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.29.88.0/24}

volumes:
  gachipad-data:
  mongo-data:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
