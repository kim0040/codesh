name: codesh-dev

services:
  mongo:
    image: mongo:8
    ulimits:
      nofile: 64000
    logging: &logging
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:${MONGO_DEV_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  valkey:
    image: valkey/valkey:8
    logging: *logging
    ports:
      - "127.0.0.1:${VALKEY_DEV_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo-data:
  valkey-data:
