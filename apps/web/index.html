<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Before any request of this page: a legacy ?key= address never goes out in a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c13" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>codesh</title>
    <script>
      // Apply the saved app theme before first paint so the page never flashes the wrong one.
      (() => {
        try {
          const theme = localStorage.getItem("codesh.theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
